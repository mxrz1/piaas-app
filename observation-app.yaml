# OpenShift-friendly manifest (Route + ClusterIP Service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observation-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: observation
  template:
    metadata:
      labels:
        app: observation
    spec:
      containers:
      - name: web
        image: danipuh/observation-app:v1  # Docker Hub image
        ports:
        - containerPort: 8000
        env:                               # Environment variables
        - name: APP_CATEGORY
          value: "land"
        - name: DB_PATH
          value: "/tmp/observations.db"
        - name: FLASK_RUN_HOST
          value: "0.0.0.0"
        - name: FLASK_RUN_PORT
          value: "8000"
---
apiVersion: v1
kind: Service
metadata:
  name: observation-service
spec:
  selector:
    app: observation
  ports:
    - protocol: TCP
      port: 8000       # Port exposed by the service
      targetPort: 8000 # Port the Flask app listens on
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: observation-route
spec:
  to:
    kind: Service
    name: observation-service
  port:
    targetPort: 8000
