# OpenShift-friendly manifest (Route + ClusterIP Service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observation-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: observation
  template:
    metadata:
      labels:
        app: observation
    spec:
      containers:
      - name: web
        image: image-registry.openshift-image-registry.svc:5000/wild-cam-observation-v2/piaas-app:latest
        ports:
        - containerPort: 8000
        env:                               # Environment variables
        - name: APP_CATEGORY
          value: "land"
        - name: DB_PATH
          value: "/data/observations.db"
        - name: FLASK_RUN_HOST
          value: "0.0.0.0"
        - name: FLASK_RUN_PORT
          value: "8000"
        volumeMounts:
        - name: observations-data
          mountPath: /data
      volumes:
      - name: observations-data
        persistentVolumeClaim:
          claimName: observation-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: observation-service
spec:
  selector:
    app: observation
  ports:
    - protocol: TCP
      port: 8000       # Port exposed by the service
      targetPort: 8000 # Port the Flask app listens on
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: observation-route
spec:
  to:
    kind: Service
    name: observation-service
  port:
    targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: observation-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
